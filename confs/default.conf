# ============================================================================
# ComReg default configuration (HOCON, parsed by utility/read_confs.py).
#
# Layout:
#   general                 paths / bookkeeping
#   dataset                 data source + sampling / disturbance settings
#   model_shape_completion  AdaPoinTr backbone (whole block -> AdaPoinTr)
#   model_pose_estimator    coarse SE(3) pose head
#   diff_icp                differentiable ICP refinement (whole block -> DiffICP)
#   train                   training loop, optimizers, schedulers
#
# `specimen_id` / `anatomy` are injected at runtime by train.py / test.py
# (conf.put('dataset.specimen_id', ...)), so they are not listed here.
# ============================================================================

general {
    # Root for all experiment outputs; runs land in <base_exp_dir>/<id>_<anatomy>/.
    base_exp_dir = ./../outs/UltraBones100k/
}

dataset {
    # Dataset root. The env var ULTRABONES100K_ROOT overrides the literal path.
    dataset_root_folder = "/path/to/UltraBones100k"
    dataset_root_folder = ${?ULTRABONES100K_ROOT}

    npoints_gt = 32768       # points in the complete (CT) ground-truth cloud
    npoints_input = 16384    # points fed to the network (partial US input)
    bs = 2                   # clouds per batch
    dataset_len = 2048       # samples per epoch (the simulator draws on demand)

    # Random CT->US disturbance range applied to generate training pairs.
    max_rotation_deg = 90.0
    max_translation = 0.5    # normalized units (cloud divided by shape_scale)

    # Use the real-trajectory stochastic simulator's output for training.
    simulated_data_suffix = "_simulated_slice_data_realtraj.npy"
    # DBSCAN-denoise the real US validation clouds.
    denoise_intra = true
}

# ---- Shape completion: AdaPoinTr backbone ----------------------------------
# The whole block is handed to AdaPoinTr(conf['model_shape_completion']).
model_shape_completion {
    NAME = AdaPoinTr
    num_query = 512
    num_points = 32768
    center_num = [512, 256]
    global_feature_dim = 1024
    encoder_type = graph
    decoder_type = fc
    encoder_config = {
      embed_dim = 384
      depth = 6
      num_heads = 6
      k = 8
      n_group = 2
      mlp_ratio = 2
      block_style_list = [attn-graph, attn, attn, attn, attn, attn],
      combine_style = concat
    },
    decoder_config = {
      embed_dim = 384
      depth = 8
      num_heads = 6
      k = 8
      n_group = 2
      mlp_ratio = 2
      self_attn_block_style_list = [attn-graph, attn, attn, attn, attn, attn, attn, attn]
      self_attn_combine_style = concat
      cross_attn_block_style_list = [attn-graph, attn, attn, attn, attn, attn, attn, attn]
      cross_attn_combine_style = concat
    }
}

# ---- Coarse pose head ------------------------------------------------------
# Regresses a coarse SE(3) pose from the concatenated US/CT completion features.
model_pose_estimator {
    hidden_dim = 512
    dropout = 0.0
}

# ---- Differentiable ICP refinement -----------------------------------------
# Soft-correspondence + weighted-Procrustes ICP that refines the coarse pose.
# MEMORY: the correspondence tensor is O(bs * n_points^2) per iteration; keep
# n_points modest and grad_checkpoint=true so peak memory ~= one iteration
# regardless of n_iters. sigma/sigma_init are in NORMALIZED units (clouds are
# divided by shape_scale), annealed coarse->fine; tune if needed.
#   SOFT ICP with a small CONSTANT sigma (no annealing) + trimmed outlier
#   rejection. Tuned on 1_fibula (post-hoc on coarse ckpt-100): RRE 3.33->2.66,
#   RTE 4.05->3.71. Key findings: (1) annealing from a large sigma_init twists
#   rotation -- keep sigma_init == sigma small; (2) trim_ratio rejects spurious
#   partial-US->full-CT matches (critical for rotation); (3) RRE improves with
#   n_points, saturating ~4096 (8192 gives only ~0.08 deg more at 4x cost).
#   (hard=true uses standard nearest-neighbor ICP instead -- slightly better RRE
#    ~2.1 but non-smooth gradients; switch if not training with lambda_fine.)
diff_icp {
    hard = false
    sigma = 0.005
    sigma_init = 0.005
    trim_ratio = 0.2
    n_iters = 25
    n_points = 2048
    grad_checkpoint = true
    # What the ICP refinement aligns to the GT: "completed" (the completion
    # output) or "partial" (the raw partial input). The coarse pose always comes
    # from the completed-shape feature; only the geometry fed to ICP changes.
    # "completed" is the default and was the more accurate variant in our test
    # (5_tibia/ckpt-300: RTE_ICP 2.80 vs 3.83, RRE_ICP 2.51 vs 2.97 for partial).
    icp_src = "completed"
    lambda_coarse = 1
    # The hard-ICP gain is post-hoc (refines the already-good coarse model at
    # inference: validate() always runs ICP). lambda_fine=0 therefore trains
    # coarse-only (cheap) and still reports refined RTE_ICP/RRE_ICP at validation.
    # Set lambda_fine>0 to additionally co-adapt the model to ICP (backprops
    # through n_iters ICP steps per batch -> slower; uncertain extra gain here).
    lambda_fine = 0.5
}

# ---- Training loop ---------------------------------------------------------
train {
    max_epoch = 300          # checkpoints written every 50 epochs from epoch 100
    step_per_update = 8      # gradient-accumulation steps (effective batch = dataset.bs * step_per_update)
    reg_loss_ratio = 0.1     # registration loss scaled to this fraction of the completion loss (rho)

    # Optimizer + LR / BN-momentum schedulers for the shape-completion model.
    optimizer {
      type = AdamW
      kwargs = {
        lr : 0.0001
        weight_decay : 0.0005
      }
    }
    scheduler {
      type : LambdaLR
      kwargs : {
        decay_step : 21
        lr_decay : 0.9
        lowest_decay : 0.02
      }
    }
    bnmscheduler {
      type : Lambda
      kwargs : {
        decay_step : 21
        bn_decay : 0.5
        bn_momentum : 0.9
        lowest_decay : 0.01
      }
    }

    # Same, for the coarse pose-estimator model.
    optimizer_pose_estimator {
      type = Adam
      kwargs = {
        lr : 0.0001
      }
    }
    scheduler_pose_estimator {
      type : LambdaLR
      kwargs : {
        decay_step : 21
        lr_decay : 0.9
        lowest_decay : 0.02
      }
    }
    bnmscheduler_pose_estimator {
      type : Lambda
      kwargs : {
        decay_step : 21
        bn_decay : 0.5
        bn_momentum : 0.9
        lowest_decay : 0.01
      }
    }
}
